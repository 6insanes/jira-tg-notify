# Jira -> Telegram notifier configuration.
# Copy to ~/.config/jira-tg-notify/config.toml and fill in the values.

[telegram]
# BotFather token. NEVER commit this file.
token = ""
# Personal chat: "123456789"; group/supergroup: "-1001234567890".
chat_id = ""
# Only for forum topics in a supergroup; 0 disables it.
message_thread_id = 0
# api_base = "https://api.telegram.org"

[jira]
server = "https://jira.example.com"
# bearer = personal access token (PAT); basic = login + password.
auth_type = "bearer"
# Host used to read the token from ~/.netrc when api_token is empty.
netrc_host = "jira.example.com"
# api_token = ""  # prefer ~/.netrc or JIRA_TOKEN over this file
login = ""

[notify]
# Polled by JQL. Keep the window comfortably larger than the poll interval:
# Jira indexes issue changes asynchronously.
jql = "updated >= -30m ORDER BY updated ASC"
interval = 60
window_minutes = 30
# After a gap (laptop asleep, service down) look further back once, up to this
# many hours, and deliver what was missed. 0 disables the catch-up.
catchup_hours = 24
state_db = "~/.local/state/jira-tg-notify/state.db"
# Старый JSON-файл состояния (до 2.0) импортируется один раз и переименовывается.
# state_file = "~/.local/state/jira-tg-notify/state.json"
# created = new issues, status/assignee/priority = field changes, comment = new comments.
events = ["created", "status", "assignee", "priority", "comment"]
# Comment notifications: excerpt length in characters and cap per poll.
comment_chars = 400
comment_max_per_poll = 10
# Authors whose comments must not trigger a notification (display names).
authors_exclude = []
# Project keys with no notifications at all (OPS-123 -> "OPS"); case-insensitive.
# Changes are still remembered, so taking a project off the list never replays history.
# Base list: /mute and /unmute in Telegram add to it and switch it off.
projects_exclude = []
# Skip notifications about your own actions: your comments, your status/assignee/
# priority changes and issues you created. The user is resolved from the token.
ignore_self = false
# Only issues you take part in: assignee, reporter, creator, watcher, comment
# author or a [~username] mention. Everything else is remembered silently.
only_involved = false
# true = the first run only remembers current issues instead of spamming history.
seed = true
# /todo in Telegram: which issues wait for you, and how many to show.
# On review / on testing are somebody else's move, so they are skipped by default.
# todo_jql = 'assignee = currentUser() AND statusCategory != Done AND status NOT IN ("На ревью", "На тестировании") ORDER BY updated DESC'
todo_limit = 15
